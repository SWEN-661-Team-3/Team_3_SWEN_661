<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CareConnect is unavailable offline</title>
    <style>
      body { margin: 0; background: #f0ebe2; color: #141414; font: 1.125rem/1.5 Verdana, "Segoe UI", sans-serif; }
      main { max-width: 42rem; margin: 8vh auto; padding: 2rem; }
      .notice { border: 3px solid #9a4708; border-radius: .75rem; background: #fbeabf; padding: 1.5rem; }
      h1 { margin-top: 0; line-height: 1.25; }
      .actions { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1.5rem; }
      button, a { min-height: 2.75rem; box-sizing: border-box; padding: .6rem 1rem; border: 2px solid #1e3a8a; border-radius: .5rem; background: #1d4ed8; color: #fff; font: inherit; font-weight: 700; }
      a { background: #fff; color: #141414; text-decoration: none; }
      button:focus-visible, a:focus-visible { outline: 3px solid #141414; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <section class="notice" aria-labelledby="offline-title">
        <h1 id="offline-title">CareConnect cannot be loaded right now</h1>
        <p>You appear to be offline, and a saved version of CareConnect is not available on this device.</p>
        <p>Check your connection, then try again. You can also return to the home page.</p>
        <div class="actions">
          <form action="" method="get"><button type="submit">Retry</button></form>
          <a href="/">Go to CareConnect home</a>
        </div>
      </section>
    </main>
  </body>
</html>
